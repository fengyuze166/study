<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaceUp · 我的学习小天地 🌱</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  :root{--p1:#ff8fab;--p2:#c084fc;--bg:#fff7f0;--ink:#5b4a68;--muted:#a08fb3}
  body{
    background:var(--bg);color:var(--ink);display:flex;min-height:100vh;overflow-x:hidden;
    background-image:radial-gradient(#ffd6e7 1.5px,transparent 1.5px),radial-gradient(#e9d5ff 1.5px,transparent 1.5px);
    background-size:36px 36px;background-position:0 0,18px 18px;
  }
  ::selection{background:#ffd6e7}

  /* ===== 侧边栏 ===== */
  nav{width:230px;background:linear-gradient(180deg,#ffb6d5,#c4b5fd);color:#fff;
      padding:34px 0;position:sticky;top:0;height:100vh;flex-shrink:0;
      border-radius:0 30px 30px 0;box-shadow:6px 0 24px rgba(200,140,220,.18)}
  nav .mascot{font-size:52px;text-align:center;padding:6px 0 4px;animation:bounce 2.4s infinite;
              cursor:pointer;transition:.3s;user-select:none}
  nav .mascot:active{transform:scale(1.4) rotate(15deg)}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  nav .mood{text-align:center;font-size:12px;opacity:.9;padding-bottom:16px;min-height:18px}
  nav h1{font-size:22px;text-align:center;padding-bottom:20px}
  .nav-item{padding:13px 26px;cursor:pointer;display:flex;gap:11px;align-items:center;
            border-left:5px solid transparent;font-size:15px;transition:.2s}
  .nav-item:hover{background:rgba(255,255,255,.22)}
  .nav-item.active{background:rgba(255,255,255,.35);border-left-color:#fff;font-weight:700}

  main{flex:1;padding:36px 44px;overflow-y:auto;max-height:100vh}
  .page{display:none;animation:fade .35s}
  .page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1}}

  h2{font-size:26px;margin-bottom:6px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:22px}
  .card{background:#fff;border-radius:24px;padding:26px;margin-bottom:20px;
        box-shadow:0 8px 24px rgba(200,140,220,.13);
        border:3px solid #fff;outline:2px dashed #ffd6e7;outline-offset:-8px}

  label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px;color:#7c5a9e}
  select,input,textarea{width:100%;padding:11px 16px;border:2px solid #f3e8ff;border-radius:14px;
    font-size:14px;outline:none;background:#fdfaff;transition:.2s;color:var(--ink)}
  select:focus,input:focus,textarea:focus{border-color:var(--p2);box-shadow:0 0 0 4px #f3e8ff}
  input[type=range]{padding:0;accent-color:var(--p1);border:none;background:none;box-shadow:none}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}

  .btn{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border:none;
       padding:12px 28px;border-radius:999px;font-size:15px;font-weight:700;cursor:pointer;
       margin-top:18px;transition:.2s;box-shadow:0 6px 16px rgba(255,143,171,.4)}
  .btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 10px 22px rgba(255,143,171,.5)}
  .btn.ghost{background:#f6f0ff;color:#8b6fb8;box-shadow:none}
  .btn.sm{padding:7px 13px;font-size:13px;margin:0 0 0 6px}

  /* ===== 任务卡 + 打卡动效 ===== */
  .task{display:flex;align-items:center;gap:12px;padding:14px 16px;border:2px solid #fdeef5;
        border-radius:18px;margin-bottom:10px;transition:border-color .2s,background .3s;
        background:#fffdfb;position:relative}
  .task:hover{border-color:#f9c5d8;transform:translateX(4px)}
  .task input[type=checkbox]{width:20px;height:20px;accent-color:var(--p1);cursor:pointer}
  .task .mod{font-size:12px;padding:3px 11px;border-radius:999px;color:#fff;flex-shrink:0;font-weight:700}
  .task .txt{flex:1;font-size:14px}
  .task .mins{color:#c4a9d6;font-size:13px;flex-shrink:0}
  .task.done{background:#f0fdf6;border-color:#b8f0d4}
  .task.done .txt{text-decoration:line-through;color:#b8acc4}

  /* 打卡弹跳 */
  .task.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05) rotate(-1deg)}70%{transform:scale(.98)}100%{transform:scale(1)}}
  /* 取消打卡小抖动 */
  .task.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
  /* 盖章印章 */
  .stamp{position:absolute;right:64px;top:50%;font-size:26px;pointer-events:none;
         animation:stamp .5s cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes stamp{0%{transform:translateY(-50%) scale(3) rotate(-30deg);opacity:0}
                   60%{transform:translateY(-50%) scale(.9) rotate(-12deg);opacity:1}
                   100%{transform:translateY(-50%) scale(1) rotate(-12deg);opacity:0}}

  /* 漂浮的爱心/星星粒子 */
  .particle{position:fixed;pointer-events:none;z-index:999;font-size:18px;
            animation:floatUp 1.1s ease-out forwards}
  @keyframes floatUp{
    0%{transform:translate(0,0) scale(.5) rotate(0);opacity:1}
    100%{transform:translate(var(--dx),-140px) scale(1.3) rotate(var(--rot));opacity:0}
  }
  /* 撒花彩带 */
  .confetti{position:fixed;top:-20px;z-index:1000;pointer-events:none;
            animation:confettiFall var(--dur) linear forwards}
  @keyframes confettiFall{
    0%{transform:translateY(-20px) rotate(0);opacity:1}
    100%{transform:translateY(110vh) rotate(720deg);opacity:.7}
  }

  /* 全屏庆祝遮罩 */
  .celebrate{position:fixed;inset:0;background:rgba(255,247,240,.88);z-index:998;
             display:flex;flex-direction:column;align-items:center;justify-content:center;
             animation:celeIn .4s;backdrop-filter:blur(4px)}
  @keyframes celeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  .celebrate .big{font-size:80px;animation:bigBounce .8s cubic-bezier(.34,1.56,.64,1)}
  @keyframes bigBounce{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
  .celebrate h3{font-size:28px;margin:18px 0 8px;color:#7c5a9e}
  .celebrate p{color:var(--muted);font-size:15px}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:20px}
  .stat{color:#fff;border-radius:22px;padding:20px;font-size:13px;font-weight:600;
        box-shadow:0 8px 18px rgba(180,140,220,.25);transition:.2s}
  .stat:hover{transform:translateY(-4px) rotate(-1deg)}
  .stat b{font-size:28px;display:block;margin-top:6px}
  .s1{background:linear-gradient(135deg,#ff8fab,#ffb3c9)}
  .s2{background:linear-gradient(135deg,#fb923c,#fbbf24)}
  .s3{background:linear-gradient(135deg,#34d399,#6ee7b7)}
  .s4{background:linear-gradient(135deg,#a78bfa,#c4b5fd)}
  /* 火焰跳动 */
  .flame{display:inline-block;animation:flameDance .6s infinite alternate}
  @keyframes flameDance{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.18) rotate(4deg)}}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;padding:12px;background:#fdf0f7;font-size:13px;color:#a06f9e;border-radius:8px}
  td{padding:12px;border-bottom:2px dashed #fbe9f2}
  .bar{background:#f3e8ff;border-radius:999px;height:12px;width:130px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--p1),var(--p2));transition:.5s}

  .badge{font-size:12px;padding:3px 12px;border-radius:999px;font-weight:700}
  .ok{background:#d1fae5;color:#059669}
  .no{background:#ffe4e6;color:#e11d48}

  /* ===== 日历 ===== */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .cal-head h3{font-size:18px}
  .cal-btn{border:none;background:#f6f0ff;color:#8b6fb8;width:36px;height:36px;border-radius:50%;
           font-size:16px;cursor:pointer;transition:.2s}
  .cal-btn:hover{background:#e9d5ff;transform:scale(1.15) rotate(-8deg)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .cal-dow{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:4px 0}
  .cal-day{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;
           justify-content:center;font-size:13px;cursor:pointer;transition:.2s;
           background:#fbf7ff;border:2px solid transparent;animation:dayIn .3s backwards}
  .cal-day:hover{transform:scale(1.12) rotate(-3deg)}
  @keyframes dayIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
  .cal-day.other{opacity:.25;pointer-events:none}
  .cal-day.today{border-color:var(--p1);font-weight:800}
  .cal-day .dot{font-size:10px;margin-top:2px}
  .cal-day.full{background:linear-gradient(135deg,#d1fae5,#a7f3d0)}
  .cal-day.half{background:linear-gradient(135deg,#fef3c7,#fde68a)}
  .cal-day.little{background:linear-gradient(135deg,#ffe4e6,#fecdd3)}
  .legend{display:flex;gap:16px;justify-content:center;margin-top:14px;font-size:12px;color:var(--muted)}

  .review-item{padding:16px 18px;border-left:5px solid var(--p2);background:#fdf6ff;
               border-radius:0 16px 16px 0;margin-bottom:12px;font-size:14px;line-height:1.8}
  .empty{color:#c4a9d6;text-align:center;padding:40px 0;font-size:14px}
  .toast{position:fixed;top:24px;right:24px;background:#5b4a68;color:#fff;padding:13px 24px;
         border-radius:999px;opacity:0;transition:.3s;z-index:1001;font-size:14px;
         box-shadow:0 8px 20px rgba(91,74,104,.3)}
  @media(max-width:760px){
    nav{width:66px;padding:24px 0;border-radius:0 20px 20px 0}
    nav h1,.nav-item .txt,nav .mood{display:none}
    nav .mascot{font-size:32px}
    .nav-item{justify-content:center;padding:16px 0}
    main{padding:20px}
    .row{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<nav>
  <div class="mascot" id="mascot" onclick="patMascot()" title="点我一下～">🐰</div>
  <div class="mood" id="mood">今天也要加油鸭</div>
  <h1>PaceUp</h1>
  <div class="nav-item active" onclick="show(0,this)">🗓️ <span class="txt">智能规划</span></div>
  <div class="nav-item" onclick="show(1,this)">✅ <span class="txt">每日打卡</span></div>
  <div class="nav-item" onclick="show(2,this)">📅 <span class="txt">进度日历</span></div>
  <div class="nav-item" onclick="show(3,this)">🧠 <span class="txt">复盘总结</span></div>
</nav>

<main>

<!-- ============ 1 智能规划 ============ -->
<section class="page active">
  <h2>🗓️ 智能学习规划</h2>
  <p class="sub">告诉我你的情况，为你定制专属学习节奏 🌷</p>
  <div class="card">
    <div class="row">
      <div>
        <label>📚 学习方向</label>
        <select id="subject">
          <option>英语学习</option><option>编程开发</option><option>考研备考</option>
          <option>考证冲刺</option><option>阅读写作</option><option>自定义方向</option>
        </select>
      </div>
      <div>
        <label>🌱 当前基础</label>
        <select id="level">
          <option>零基础入门</option><option selected>有一定基础</option><option>进阶提升</option><option>高手冲刺</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label>⏰ 每日可用时长</label>
        <select id="time">
          <option value="1">30 分钟</option><option value="2" selected>1 小时</option>
          <option value="3">2 小时</option><option value="4">3 小时以上</option>
        </select>
      </div>
      <div>
        <label>💗 偏好的学习方式</label>
        <select id="pref">
          <option>理论学习为主</option><option>实践练习为主</option>
          <option>视频/课程为主</option><option selected>混合模式</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label>🗓️ 学习周期</label>
        <select id="cycle">
          <option value="2">2 周（短期突击）</option><option value="4" selected>4 周（一个阶段）</option><option value="12">12 周（长期养成）</option>
        </select>
      </div>
      <div>
        <label>🔥 计划强度：<b id="diffLabel" style="color:var(--p1)">标准 💪</b></label>
        <input type="range" id="diff" min="1" max="3" value="2"
               oninput="diffLabel.textContent=['轻松 😌','标准 💪','强化 🔥'][this.value-1]">
      </div>
    </div>
    <button class="btn" onclick="genPlan()">✨ 生成 / 更新学习计划</button>
    <button class="btn ghost" onclick="clearAll()">🗑️ 重置全部数据</button>
  </div>
  <div class="card" id="planView"></div>
</section>

<!-- ============ 2 每日打卡 ============ -->
<section class="page">
  <h2>✅ 每日打卡</h2>
  <p class="sub">完成一项勾一项，今天也要加油鸭 🐣</p>
  <div class="card" id="checkinView"></div>
</section>

<!-- ============ 3 进度日历 ============ -->
<section class="page">
  <h2>📅 进度日历</h2>
  <p class="sub">打过卡的日子都有小标记，点击日期查看当天详情 👀</p>
  <div class="stat-grid" id="statGrid"></div>
  <div class="card">
    <div class="cal-head">
      <button class="cal-btn" onclick="changeMonth(-1)">‹</button>
      <h3 id="calTitle"></h3>
      <button class="cal-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="legend">
      <span>🌸 全部完成</span><span>🌼 完成过半</span><span>🌷 部分完成</span><span>⬜ 未打卡</span>
    </div>
  </div>
  <div class="card" id="dayDetail"></div>
  <div class="card"><table id="progressTable"></table></div>
</section>

<!-- ============ 4 复盘总结 ============ -->
<section class="page">
  <h2>🧠 复盘总结</h2>
  <p class="sub">一键生成复盘，发现薄弱点，遇见更好的自己 🌈</p>
  <button class="btn" onclick="genReview()">🔍 生成复盘报告</button>
  <div id="reviewView" style="margin-top:20px"></div>
</section>

</main>
<div class="toast" id="toast"></div>

<script>
/* ================= 数据层 ================= */
const DB={
  get(k,d){try{return JSON.parse(localStorage.getItem('paceup_'+k))??d}catch{return d}},
  set(k,v){localStorage.setItem('paceup_'+k,JSON.stringify(v))}
};
let plan=DB.get('plan',null);
let logs=DB.get('logs',{});
const MODCOLORS={核心学习:'#a78bfa',练习巩固:'#7dd3fc',输出实践:'#fbbf24',复习回顾:'#6ee7b7',拓展提升:'#f9a8d4',自定义:'#c4b5fd'};

/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const fmtD=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>fmtD(new Date());
const uid=()=>'t'+Date.now()+Math.floor(Math.random()*999);
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2200)}
function show(i,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.page')[i].classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  if(i===1)renderCheckin();
  if(i===2)renderDashboard();
}

/* ================= 🎉 动效引擎 ================= */
/* 1. 粒子喷发：从指定元素位置爆出爱心/星星 */
function burstParticles(el,emojis=['💖','⭐','✨','🌸','💜']){
  const r=el.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<10;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    p.style.left=cx+'px'; p.style.top=cy+'px';
    p.style.setProperty('--dx',(Math.random()*160-80)+'px');
    p.style.setProperty('--rot',(Math.random()*90-45)+'deg');
    p.style.fontSize=(14+Math.random()*12)+'px';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1200);
  }
}
/* 2. 全屏撒花彩带 */
function confettiRain(count=60){
  const colors=['#ff8fab','#c084fc','#6ee7b7','#7dd3fc','#fbbf24','#f9a8d4'];
  for(let i=0;i<count;i++){
    const c=document.createElement('div');
    c.className='confetti';
    const size=6+Math.random()*8;
    c.style.left=Math.random()*100+'vw';
    c.style.width=size+'px'; c.style.height=size*0.5+'px';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.borderRadius='3px';
    c.style.setProperty('--dur',(2+Math.random()*2)+'s');
    c.style.animationDelay=(Math.random()*0.8)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
  }
}
/* 3. 全屏庆祝 */
const CELE_MSGS=['太棒了！今日任务全清！','你简直是学习小天才！','全部完成，给自己鼓鼓掌！','今天也是满分的一天！','自律的你闪闪发光！'];
function celebrate(){
  confettiRain(80);
  const div=document.createElement('div');
  div.className='celebrate';
  div.innerHTML=`<div class="big">🎉</div>
    <h3>${CELE_MSGS[Math.floor(Math.random()*CELE_MSGS.length)]}</h3>
    <p>点击任意处继续～</p>`;
  div.onclick=()=>div.remove();
  document.body.appendChild(div);
  setTimeout(()=>{if(div.parentNode)div.remove()},4000);
}
/* 4. 吉祥物互动 */
const MOODS={none:['🐰','还没开始哦～'],some:['🐹','加油，快到一半啦！'],half:['🦊','过半了，冲呀！'],all:['🥳','今日全完成，棒呆！']};
let patCount=0;
function updateMascot(){
  if(!plan)return;
  const rec=logs[today()]||{};
  const total=plan.tasks.length;
  const done=plan.tasks.filter(t=>rec[t.id]).length;
  let m=MOODS.none;
  if(done>=total&&total>0)m=MOODS.all;
  else if(done>=total/2)m=MOODS.half;
  else if(done>0)m=MOODS.some;
  $('mascot').textContent=m[0];
  $('mood').textContent=m[1];
}
function patMascot(){
  patCount++;
  burstParticles($('mascot'),['💕','🥕','💗']);
  const m=$('mascot');
  m.style.animation='none';m.offsetHeight;m.style.animation='';
  if(patCount===10)toast('🐰：别摸啦，快去学习！');
  else if(patCount===30){toast('🐰：好吧好吧，给你加个好运 buff ✨');confettiRain(20);patCount=0}
}

/* ================= 1. 智能规划 ================= */
const TEMPLATES={
  '英语学习':[['核心学习','背诵新单词 20 个',20],['核心学习','精读英文材料 1 篇',25],
    ['练习巩固','听力精听训练 15 分钟',15],['输出实践','口语跟读 + 自由表达 10 分钟',15],
    ['复习回顾','复习昨日生词与笔记',10],['拓展提升','观看英文视频 1 个（无字幕挑战）',15]],
  '编程开发':[['核心学习','学习新知识点 / 教程 1 节',30],['练习巩固','完成配套练习或算法题 2 道',30],
    ['输出实践','动手写一个小功能 / 小项目片段',30],['复习回顾','整理今日笔记与代码片段',10],
    ['拓展提升','阅读优质技术文章 1 篇',15]],
  '考研备考':[['核心学习','专业课/数学新知识学习 1 章',40],['练习巩固','对应章节习题训练',30],
    ['核心学习','英语：单词 + 长难句',25],['复习回顾','错题整理与复盘',20],
    ['拓展提升','政治/专业课知识点速记',15]],
  '考证冲刺':[['核心学习','考点学习 1 个章节',35],['练习巩固','章节真题训练 20 题',25],
    ['复习回顾','错题重做与知识点回炉',20],['拓展提升','模拟卷限时训练（部分）',30]],
  '阅读写作':[['核心学习','深度阅读 30 分钟',30],['输出实践','写读书笔记 / 心得 300 字',25],
    ['练习巩固','仿写好句好段 2 段',15],['复习回顾','回顾本周摘抄，温故知新',10],
    ['拓展提升','学习一个写作技巧并尝试运用',15]],
  '自定义方向':[['核心学习','今日核心学习任务 30 分钟',30],['练习巩固','配套练习 / 巩固训练',20],
    ['输出实践','输出成果：笔记/作品/总结',20],['复习回顾','回顾昨日内容',10]]
};
const LEVEL_ADJ={'零基础入门':-1,'有一定基础':0,'进阶提升':0,'高手冲刺':1};

function genPlan(){
  const subject=$('subject').value,level=$('level').value,time=+$('time').value,
        diff=+$('diff').value,pref=$('pref').value,cycle=$('cycle').value;
  const pool=[...TEMPLATES[subject]];
  let count=Math.min(pool.length,Math.max(2,time+diff-2+LEVEL_ADJ[level]));
  if(pref==='实践练习为主')
    pool.sort((a,b)=>((b[0]==='输出实践'||b[0]==='练习巩固')?1:0)-((a[0]==='输出实践'||a[0]==='练习巩固')?1:0));
  const tasks=pool.slice(0,count).map(t=>({id:uid(),module:t[0],text:t[1],mins:t[2]}));
  plan={meta:{subject,level,time,pref,cycle,diff,start:today()},tasks};
  DB.set('plan',plan);renderPlan();updateMascot();
  confettiRain(25);
  toast(`✅ ${cycle} 周计划生成啦，每日 ${count} 个任务～`);
}
function renderPlan(){
  const v=$('planView');
  if(!plan){v.innerHTML='<div class="empty">🌷 还没有学习计划，先在上方生成一个吧</div>';return}
  const m=plan.meta;
  let html=`<p style="margin-bottom:6px;font-size:16px"><b>${m.subject}</b>
    <span class="badge" style="background:#f3e8ff;color:#8b5cf6;margin-left:8px">${m.cycle} 周计划</span></p>
    <p style="color:var(--muted);font-size:13px;margin-bottom:16px">
    ${m.level} · 每日约${['30分钟','1小时','2小时','3小时+'][m.time-1]} · ${['轻松','标准','强化'][m.diff-1]}强度 · ${m.pref} · 始于 ${m.start}</p>`;
  plan.tasks.forEach(t=>{
    html+=`<div class="task">
      <span class="mod" style="background:${MODCOLORS[t.module]||'#c4b5fd'}">${t.module}</span>
      <span class="txt">${t.text}</span>
      <span class="mins">${t.mins}min</span>
      <button class="btn sm ghost" onclick="editTask('${t.id}')">✏️</button>
      <button class="btn sm ghost" onclick="delTask('${t.id}')">🗑</button>
    </div>`;
  });
  html+=`<button class="btn sm" style="margin-top:10px" onclick="addTask()">＋ 添加自定义任务</button>`;
  v.innerHTML=html;
}
function editTask(id){
  const t=plan.tasks.find(x=>x.id===id);
  const nt=prompt('修改任务内容：',t.text);
  if(nt&&nt.trim()){t.text=nt.trim();DB.set('plan',plan);renderPlan();toast('任务已修改 ✏️')}
}
function delTask(id){
  plan.tasks=plan.tasks.filter(x=>x.id!==id);
  DB.set('plan',plan);renderPlan();toast('任务已删除');
}
function addTask(){
  const text=prompt('新任务内容：');if(!text||!text.trim())return;
  const module=prompt('所属模块（核心学习/练习巩固/输出实践/复习回顾/拓展提升/自定义）：','自定义')||'自定义';
  plan.tasks.push({id:uid(),module,text:text.trim(),mins:15});
  DB.set('plan',plan);renderPlan();toast('任务已添加 🌱');
}
function clearAll(){
  if(confirm('确定清空所有计划与打卡数据吗？此操作不可恢复哦～')){
    localStorage.clear();plan=null;logs={};renderPlan();updateMascot();toast('已全部重置');
  }
}

/* ================= 2. 每日打卡（带动效） ================= */
const PRAISE=['🎉 打卡成功！','💖 又完成一项！','⭐ 状态在线！','🌟 积少成多！','🚀 继续前进！'];
function renderCheckin(){
  const v=$('checkinView');
  if(!plan){v.innerHTML='<div class="empty">🌷 请先在「智能规划」页生成学习计划</div>';return}
  const rec=logs[today()]||{};
  const doneCount=plan.tasks.filter(t=>rec[t.id]).length;
  const pct=plan.tasks.length?Math.round(doneCount/plan.tasks.length*100):0;
  let html=`<p style="margin-bottom:6px">📅 <b>${today()}</b></p>
    <p style="color:var(--muted);font-size:13px;margin-bottom:10px">今日进度：${doneCount}/${plan.tasks.length}
    ${doneCount===plan.tasks.length&&doneCount>0?' 🎉 全部完成，太棒啦！':''}</p>
    <div class="bar" style="width:100%;margin-bottom:18px"><i style="width:${pct}%"></i></div>`;
  plan.tasks.forEach(t=>{
    const done=rec[t.id]===true;
    html+=`<div class="task ${done?'done':''}" id="task-${t.id}">
      <input type="checkbox" ${done?'checked':''} onchange="toggle('${t.id}',this)">
      <span class="mod" style="background:${MODCOLORS[t.module]||'#c4b5fd'}">${t.module}</span>
      <span class="txt">${t.text}</span>
      <span class="badge ${done?'ok':'no'}">${done?'已完成 💖':'未完成'}</span>
    </div>`;
  });
  html+=`<label style="margin-top:16px">📝 今日小结 / 心得（可选）</label>
    <textarea id="note" rows="2" placeholder="今天学到了什么？卡在哪里了？">${rec.note||''}</textarea>
    <button class="btn" onclick="saveNote()">💾 保存小结</button>`;
  v.innerHTML=html;
  updateMascot();
}
function toggle(id,checkbox){
  const d=today();
  if(!logs[d])logs[d]={};
  const done=checkbox.checked;
  logs[d][id]=done;DB.set('logs',logs);

  const card=$('task-'+id);
  if(done){
    /* 🎉 打卡动画组合：弹跳 + 粒子 + 盖章 */
    card.classList.add('pop');
    burstParticles(checkbox);
    const stamp=document.createElement('span');
    stamp.className='stamp';stamp.textContent='💮';
    card.appendChild(stamp);
    setTimeout(()=>stamp.remove(),600);
    toast(PRAISE[Math.floor(Math.random()*PRAISE.length)]);
    /* 全部完成 → 全屏庆祝 */
    const rec=logs[d];
    const allDone=plan.tasks.every(t=>rec[t.id]===true);
    setTimeout(()=>{
      renderCheckin();
      if(allDone){celebrate()}
    },450);
  }else{
    card.classList.add('shake');
    toast('已标记为未完成');
    setTimeout(()=>renderCheckin(),400);
  }
}
function saveNote(){
  const d=today();
  if(!logs[d])logs[d]={};
  logs[d].note=$('note').value;DB.set('logs',logs);toast('小结已保存 💾');
}

/* ================= 3. 进度日历 ================= */
let calDate=new Date();
function changeMonth(n){calDate.setMonth(calDate.getMonth()+n);renderCalendar()}
function dayRate(key){
  const rec=logs[key];
  if(!rec||!plan)return null;
  let tt=0,dd=0;
  plan.tasks.forEach(t=>{if(rec[t.id]!==undefined){tt++;if(rec[t.id])dd++}});
  return tt?dd/tt:null;
}
function renderDashboard(){
  const dates=Object.keys(logs).sort();
  let total=0,done=0;const modStat={};
  dates.forEach(d=>{if(!plan)return;plan.tasks.forEach(t=>{
    if(logs[d][t.id]!==undefined){
      total++;modStat[t.module]=modStat[t.module]||{done:0,total:0};modStat[t.module].total++;
      if(logs[d][t.id]){done++;modStat[t.module].done++}
    }})});
  let streak=0;const cur=new Date();
  while(logs[fmtD(cur)]){streak++;cur.setDate(cur.getDate()-1)}
  const rate=total?Math.round(done/total*100):0;
  $('statGrid').innerHTML=`
    <div class="stat s1">📅 累计打卡<b>${dates.length} 天</b></div>
    <div class="stat s2"><span class="flame">🔥</span> 连续打卡<b>${streak} 天</b></div>
    <div class="stat s3">✅ 完成任务<b>${done} 个</b></div>
    <div class="stat s4">📈 总完成率<b>${rate}%</b></div>`;
  renderCalendar();
  showDayDetail(today());
  const mods=Object.keys(modStat);
  if(!mods.length){
    $('progressTable').innerHTML='<tr><td><div class="empty">🌷 暂无数据，先去打卡吧</div></td></tr>';return;
  }
  let rows='<tr><th>学习模块</th><th>已完成</th><th>任务总数</th><th>完成率</th></tr>';
  mods.forEach(m=>{
    const s=modStat[m],r=Math.round(s.done/s.total*100);
    rows+=`<tr><td><span class="badge" style="background:${(MODCOLORS[m]||'#c4b5fd')}33;color:#7c5a9e">${m}</span></td>
      <td>${s.done}</td><td>${s.total}</td>
      <td><div style="display:flex;align-items:center;gap:10px"><div class="bar"><i style="width:${r}%"></i></div>${r}%</div></td></tr>`;
  });
  $('progressTable').innerHTML=rows;
}
function renderCalendar(){
  const y=calDate.getFullYear(),m=calDate.getMonth();
  $('calTitle').textContent=`${y} 年 ${m+1} 月 🌸`;
  const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();
  const startDow=(first.getDay()+6)%7;
  let html=['一','二','三','四','五','六','日'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const prevDays=new Date(y,m,0).getDate();
  for(let i=startDow-1;i>=0;i--)html+=`<div class="cal-day other">${prevDays-i}</div>`;
  for(let d=1;d<=days;d++){
    const key=`${y}-${pad(m+1)}-${pad(d)}`;
    const r=dayRate(key);
    let cls='',dot='';
    if(r!==null){
      if(r>=1){cls='full';dot='🌸'}
      else if(r>=0.5){cls='half';dot='🌼'}
      else{cls='little';dot='🌷'}
    }
    const isToday=key===today()?'today':'';
    html+=`<div class="cal-day ${cls} ${isToday}" style="animation-delay:${d*15}ms" onclick="showDayDetail('${key}')">${d}<span class="dot">${dot}</span></div>`;
  }
  const total=startDow+days,remain=(7-total%7)%7;
  for(let d=1;d<=remain;d++)html+=`<div class="cal-day other">${d}</div>`;
  $('calGrid').innerHTML=html;
}
function showDayDetail(key){
  const v=$('dayDetail');
  const rec=logs[key];
  const wd=['周日','周一','周二','周三','周四','周五','周六'][new Date(key).getDay()];
  if(!rec||!plan){
    v.innerHTML=`<h3 style="font-size:16px;margin-bottom:10px">📖 ${key} ${wd}</h3>
      <div class="empty" style="padding:18px 0">${key>today()?'🔮 这一天还没到来～':'☁️ 这一天没有打卡记录'}</div>`;
    return;
  }
  let html=`<h3 style="font-size:16px;margin-bottom:12px">📖 ${key} ${wd}</h3>`;
  plan.tasks.forEach(t=>{
    if(rec[t.id]!==undefined){
      const done=rec[t.id];
      html+=`<div class="task ${done?'done':''}" style="margin-bottom:8px">
        <span class="mod" style="background:${MODCOLORS[t.module]||'#c4b5fd'}">${t.module}</span>
        <span class="txt">${t.text}</span>
        <span class="badge ${done?'ok':'no'}">${done?'已完成 💖':'未完成'}</span>
      </div>`;
    }
  });
  if(rec.note)html+=`<div class="review-item" style="margin-top:10px">📝 <b>当日小结</b>：${rec.note}</div>`;
  v.innerHTML=html;
}

/* ================= 4. 复盘总结 ================= */
function genReview(){
  const v=$('reviewView');
  if(!plan){v.innerHTML='<div class="card empty">🌷 请先生成学习计划</div>';return}
  const dates=Object.keys(logs).sort();
  if(!dates.length){v.innerHTML='<div class="card empty">🌷 还没有打卡记录，先坚持几天再来复盘吧</div>';return}
  const miss={},tot={};
  dates.forEach(d=>{plan.tasks.forEach(t=>{
    if(logs[d][t.id]!==undefined){
      tot[t.module]=(tot[t.module]||0)+1;
      if(!logs[d][t.id])miss[t.module]=(miss[t.module]||0)+1;
    }})});
  const mods=Object.keys(tot);
  const weak=mods.sort((a,b)=>(miss[b]||0)/tot[b]-(miss[a]||0)/tot[a]);
  const strong=[...weak].reverse();
  const totalD=mods.reduce((a,m)=>a+tot[m],0);
  const missD=mods.reduce((a,m)=>a+(miss[m]||0),0);
  const rate=Math.round((totalD-missD)/totalD*100);
  const ADVICE={
    '核心学习':'核心任务是地基。建议把它固定在每天精力最好的时段最先完成，避免被琐事挤占。',
    '练习巩固':'练习容易被跳过——可以降低单次练习量（比如从 20 题减到 10 题），先保证每天都做。',
    '输出实践':'输出类任务最容易畏难拖延。把目标缩小到「5 分钟起步」，往往开始后就会做完。',
    '复习回顾':'复习容易被忽视。建议利用碎片时间（通勤/睡前）快速过一遍，配合间隔复习效果更佳。',
    '拓展提升':'拓展任务优先级可放低，状态好时再做，不必因此产生负罪感。',
    '自定义':'检查自定义任务是否描述太模糊，把任务改成可量化的小步骤更容易完成。'
  };
  const nextAdvice=rate>=80
    ?'表现优秀！下一阶段可以把强度上调一档，或给优势模块增加更有挑战性的内容。'
    :rate>=50
    ?'整体尚可。建议固定每日学习时段（如早起后/晚饭后），用「同一时间点」养成自动化习惯。'
    :'完成率偏低。建议把难度调到「轻松」、减少每日任务数，先做到「每天都学一点」再谈强度。';
  const notes=dates.filter(d=>logs[d].note).slice(-3);
  v.innerHTML=`<div class="card">
    <h3 style="margin-bottom:14px">📋 复盘报告（${dates[0]} ~ ${dates[dates.length-1]}）</h3>
    <div class="review-item">📊 <b>总体表现</b>：打卡 <b>${dates.length}</b> 天，任务完成率 <b>${rate}%</b>。
      ${rate>=80?'节奏很好，继续保持！🌟':rate>=50?'有进步空间，重点提升稳定性 💪':'别灰心，从降低任务量重新开始 🌱'}</div>
    <div class="review-item">⚠️ <b>最常遗漏</b>：<b>${weak[0]}</b>（遗漏 ${miss[weak[0]]||0} 次）。<br>💡 ${ADVICE[weak[0]]||''}</div>
    <div class="review-item">💪 <b>优势模块</b>：<b>${strong[0]}</b> 完成最好。把完成它时的状态和方法，复制到薄弱模块上 ✨</div>
    <div class="review-item">🎯 <b>下一阶段建议</b>：<br>① 每天最先做「${weak[0]}」类任务，先啃硬骨头；<br>② ${nextAdvice}<br>③ 每周日固定看一次本报告，形成「计划 → 执行 → 复盘」闭环 🔁</div>
    ${notes.length?`<div class="review-item">📝 <b>最近的小结</b>：${notes.map(d=>`<br>· ${d}：${logs[d].note}`).join('')}</div>`:''}
  </div>`;
  confettiRain(20);
  toast('复盘报告已生成 🌈');
}

/* ================= 初始化 ================= */
renderPlan();
updateMascot();
</script>
